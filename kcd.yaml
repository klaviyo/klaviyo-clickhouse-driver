env:
  ENG_ECR_REGISTRY: 340433579684.dkr.ecr.us-east-1.amazonaws.com

  # login for dev, eng, prod
  AWS_ECR_LOGIN_REGISTRY_IDS: "439508887365,340433579684,368154587575"

  # Set shared repository for unit test images
  CI_ECR_REPOSITORY: ci-shared

  # Set CI image name
  CI_IMAGE: "${ENG_ECR_REGISTRY}/${CI_ECR_REPOSITORY}:${BUILDKITE_PIPELINE_SLUG}_${BUILDKITE_COMMIT}"

steps:
# Run pre-commit
- label: ":pre-commit: Run Pre-commit"
  key: pre-commit
  command: "kbc lint pre-commit -v --buildkite-annotate pre-commit-annotation"
  secrets:
    - buildkite-github-app-pem
    - buildkite-api-token
  docker:
    image: "${ENG_ECR_REGISTRY}/klaviyo-pre-commit-python3-10-12:3.10.12"
    mount-ssh-agent: true
    volumes:
      - /var/lib/buildkite-agent/.config/pip/pip.conf:/etc/pip.conf

- label: ":building_construction: Build CI image"
  key: build-ci-image
  command: >
    kbc docker-utils build-and-publish -f Dockerfile -i ${CI_ECR_REPOSITORY} -t ${BUILDKITE_PIPELINE_SLUG}_${BUILDKITE_COMMIT} --pass-pip-creds -a eng

- group: "Tests"
  key: "tests"
  steps:
    - label: "Unit Tests"
      key: "unit"
      depends_on:
        - build-ci-image
      command: >
        pytest
      docker:
        image: "$CI_IMAGE"

- label: "Setup.py is Changed"
  key: setup-py-changed
  command: "(kbc github get-changed-files | grep setup.py) || (echo 'Please manually bump the version in setup.py' && exit 1)"

- label: ":jfrog: Publish to Artifactory"
  command: "kbc python-utils publish-distribution-bdist"
  if: build.branch == 'master'
  depends_on:
    - tests
    - setup-py-changed
    - build-ci-image
  secrets:
    - "jfrog-artifactory-jenkins-pypirc-file"
  docker:
    image: "$CI_IMAGE"
